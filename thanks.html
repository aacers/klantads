<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Klantads — payment received</title>
  <style>
    :root { --bg:#f4efe6; --ink:#1c1914; --muted:#5c564c; --accent:#c45c26; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg);
      color:var(--ink); font-family:"Iowan Old Style", Palatino, Georgia, serif; }
    .card { width:min(520px, calc(100% - 32px)); }
    .kicker { text-transform:uppercase; letter-spacing:.12em; font-size:.72rem; color:var(--muted);
      font-family:ui-sans-serif, system-ui, sans-serif; }
    h1 { font-size:clamp(2rem, 5vw, 2.8rem); letter-spacing:-.04em; line-height:.98; margin:10px 0 14px; }
    p { font-size:1.1rem; color:var(--muted); max-width:36ch; }
    a { color:var(--accent); }
    .fine { font-family:ui-sans-serif, system-ui, sans-serif; font-size:.85rem; }
  </style>
</head>
<body>
  <div class="card">
    <p class="kicker">Klantads</p>
    <h1>Payment received.</h1>
    <p>Send your shop URL and bestselling product to <a href="mailto:t.grootes@gmail.com">t.grootes@gmail.com</a>. First batch in 7 days.</p>
    <p class="fine"><a href="./">Back to Klantads</a></p>
  </div>
</body>
</html>
